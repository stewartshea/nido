services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Encrypted per-family namespaces + registry (Phase A). KAMORI_MASTER_KEY
      # is REQUIRED in production — generate with: openssl rand -hex 32
      - KAMORI_MASTER_KEY=${KAMORI_MASTER_KEY:-}
      - KAMORI_DATA_DIR=${KAMORI_DATA_DIR:-/data}
      - JWT_SECRET=${JWT_SECRET:-nido-secret-key-change-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - SIGNUP_ENABLED=${SIGNUP_ENABLED:-}
    volumes:
      # Host folder persists the encrypted namespace DBs (visible, backup-able)
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      # In Docker Compose the web and api are separate containers, so the
      # Vite proxy (/api) must target the api service, not localhost.
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://api:3000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
    depends_on:
      - api
    restart: unless-stopped