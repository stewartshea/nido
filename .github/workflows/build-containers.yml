name: Build Nido containers

on:
  workflow_dispatch: 
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Build api and web in parallel; each job is independent.
      matrix:
        service: [api, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch build support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:12}"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}"
          # Always tag with the short commit sha.
          IMG="${BASE}/${SERVICE}:sha-${SHORT_SHA}"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          # Two tiers, deliberately separate:
          #
          #   main   - a build of whatever was just merged. Floating, unreleased.
          #   v<date> - a release. Immutable, and what a deployment should pin.
          #
          # `latest` tracks the newest RELEASE, not the newest commit. It used to
          # be set on every main push, which meant pulling `latest` silently ran
          # unreleased code — the tag said "latest" and meant "newest thing
          # anyone pushed".
          TAGS="${IMG}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${BASE}/${SERVICE}:main"
          fi
          # Any run whose ref is a tag publishes that version. Not gated on
          # event_name: a tag pushed with the default GITHUB_TOKEN does not
          # start a run at all, so release.yml dispatches this workflow at the
          # tag and it must still pick up the version here.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${BASE}/${SERVICE}:${{ github.ref_name }},${BASE}/${SERVICE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}