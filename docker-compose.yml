services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Encrypted per-family namespaces + registry (Phase A). No defaults exist.
      - NIDO_MASTER_KEY=${NIDO_MASTER_KEY:?set NIDO_MASTER_KEY in .env (openssl rand -hex 32)}
      - NIDO_DATA_DIR=${NIDO_DATA_DIR:-/data}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - SIGNUP_ENABLED=${SIGNUP_ENABLED:-}
      # Notification digests. On by default; set NOTIFY_ENABLED=false to stop
      # the timer (e.g. when running a second API replica for the timer only).
      - NOTIFY_ENABLED=${NOTIFY_ENABLED:-}
      - NOTIFY_INTERVAL_MINUTES=${NOTIFY_INTERVAL_MINUTES:-60}
    volumes:
      # Host folder persists the encrypted namespace DBs (visible, backup-able)
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      # Separate containers, so the web server proxies browser /api calls to
      # the api service rather than localhost.
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://api:3000}
    depends_on:
      - api
    restart: unless-stopped