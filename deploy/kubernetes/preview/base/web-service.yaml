apiVersion: v1
kind: Service
metadata:
  name: nido-preview-web
  labels:
    app: nido-preview-web
spec:
  type: ClusterIP
  selector:
    app: nido-preview-web
  ports:
    - name: web
      # The HTTPRoute points at 80; the container listens on 3001.
      port: 80
      targetPort: 3001
      protocol: TCP
