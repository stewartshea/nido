apiVersion: apps/v1
kind: Deployment
metadata:
  name: nido-api
  namespace: nido
  labels:
    app: nido-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nido-api
  template:
    metadata:
      labels:
        app: nido-api
    spec:
      containers:
        - name: api
          # Replace with your registry image, e.g. ghcr.io/you/nido-api:latest
          image: nido/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PHOTO_DIR
              value: "/data/photos"
            # Runtime data directory (registry DB + per-family DBs). Defaults
            # to ./data when unset; pinned to the PVC mount here.
            - name: KAMORI_DATA_DIR
              value: "/data"
            - name: KAMORI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: nido
                  key: KAMORI_MASTER_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nido
                  key: JWT_SECRET
            # Optional: designate the single platform admin by email.
            - name: ADMIN_EMAIL
              value: ""
            # Set to "false" to block new registrations (authoritative, locks
            # the Admin toggle). Omit/empty to use the DB toggle value.
            - name: SIGNUP_ENABLED
              value: ""
            # Base URL used in emailed links (verify / reset). Use the public
            # origin, e.g. https://nido.example.com, not localhost.
            - name: PUBLIC_URL
              value: "http://localhost:3001"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nido-data