services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Encrypted per-family namespaces + registry (Phase A). No defaults exist.
      - NIDO_MASTER_KEY=${NIDO_MASTER_KEY:?set NIDO_MASTER_KEY in .env (openssl rand -hex 32)}
      - NIDO_DATA_DIR=${NIDO_DATA_DIR:-/data}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - SIGNUP_ENABLED=${SIGNUP_ENABLED:-}
    volumes:
      # Host folder persists the encrypted namespace DBs (visible, backup-able)
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      # In Docker Compose the web and api are separate containers, so the
      # Vite proxy (/api) must target the api service, not localhost.
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://api:3000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
    depends_on:
      - api
    restart: unless-stopped