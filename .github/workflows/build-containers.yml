name: Build Nido containers

on:
  workflow_dispatch: 
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Build api and web in parallel; each job is independent.
      matrix:
        service: [api, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch build support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Runs before the login so it can also decide *whether* to publish: a
      # pull request is published as `dev` (see the tiers below) unless it came
      # from a fork, which gets a read-only GITHUB_TOKEN.
      - name: Derive image tags
        id: meta
        env:
          SERVICE: ${{ matrix.service }}
          # The head commit of the pull request, not the merge commit.
          #
          # On a pull_request event github.sha is the merge commit GitHub
          # synthesises (refs/pull/N/merge). Tagging the image with that
          # means the image for pull request #42 is "#42 merged into
          # whatever main was when the build ran" — so the tag changes
          # every time main moves, even though the branch did not, and the
          # tag does not identify a commit that exists on the branch.
          #
          # The head sha is the commit the branch actually points at. It is
          # what the preview environment deploys, and it is stable for as
          # long as the branch is.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          # Empty on anything that is not a pull request.
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:12}"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}"

          # Always tag with the short commit sha.
          IMG="${BASE}/${SERVICE}:sha-${SHORT_SHA}"
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"

          # Three tiers, deliberately separate:
          #
          #   dev     - a build of an open pull request, for running a proposed
          #             change on a real instance before it merges. Floating:
          #             it follows the branch, so it is rebuilt on every push
          #             to the PR. There is one `dev` tag per service, shared
          #             by every open PR, so the newest build to finish wins —
          #             the `sha-` tag is what says which commit it is.
          #   main    - a build of whatever was just merged. Floating, unreleased.
          #   v<date> - a release. Immutable, and what a deployment should pin.
          #
          # `latest` tracks the newest RELEASE, not the newest commit. It used to
          # be set on every main push, which meant pulling `latest` silently ran
          # unreleased code — the tag said "latest" and meant "newest thing
          # anyone pushed".
          TAGS="${IMG}"
          PUSH="true"

          if [ "${EVENT}" = "pull_request" ]; then
            TAGS="${TAGS},${BASE}/${SERVICE}:dev"
            # A fork's GITHUB_TOKEN cannot write packages, so its build is
            # validation only.
            if [ "${PR_HEAD_REPO}" != "${REPO}" ]; then
              PUSH="false"
            fi
          fi

          if [ "${EVENT}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${BASE}/${SERVICE}:main"
          fi
          # Any run whose ref is a tag publishes that version. Not gated on
          # event_name: a tag pushed with the default GITHUB_TOKEN does not
          # start a run at all, so release.yml dispatches this workflow at the
          # tag and it must still pick up the version here.
          if [ "${REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS},${BASE}/${SERVICE}:${REF_NAME},${BASE}/${SERVICE}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  test-env:
    name: Test seeded environment
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: '3.x'

      - name: Setup and validate test environment
        env:
          NIDO_MASTER_KEY: ${{ secrets.NIDO_MASTER_KEY || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'nido-test-secret-for-ci' }}
        run: |
          cd api && npm run db:init && cd ..
          task seed:test
          task seed:validate
