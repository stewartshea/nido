name: End-to-end smoke

# The Playwright suite in web/tests/e2e drives the real pair — the Hono API
# and the SvelteKit dev server — through the flows the god-pages refactor
# must not break: register, build a family, switch members, edit through the
# unified modal, walk the settings tabs, sign out. No mocks and no seeded
# data: the suite registers a random throwaway account against a database
# that lives in the runner's tmpdir and dies with the job, so it can never
# touch a real instance and needs no secrets.
#
# It runs when something the suite exercises changes: the web client, the
# API it talks to, or the suite itself. A docs-only or site-only pull
# request does not burn a runner on it.

on:
  pull_request:
    paths:
      - 'web/**'
      - 'api/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  # One run per ref; a new push supersedes the run in flight instead of
  # queueing behind it, same as the preview deployment.
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22 to match the API's engines field (the prebuilt
          # better-sqlite3-multiple-ciphers bindings are a Node-20 vs 22
          # story — see api/Dockerfile).
          node-version: '22'
          cache: 'npm'

      # One lockfile at the root covers both workspaces (api and web), so
      # one `npm ci` installs the API the suite proxies to and the web
      # client it drives — the same install the seed-test job in
      # build-containers.yml already proves on this runner image.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: web
        # --with-deps adds the handful of system libraries the headless
        # browser needs; everything else (master key, JWT secret, throwaway
        # data dir, both dev servers) is pinned by web/playwright.config.ts.
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: web
        run: npx playwright test

      # The HTML report embeds the traces (trace: on-first-retry), so this
      # one artifact is enough to debug a red run.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
