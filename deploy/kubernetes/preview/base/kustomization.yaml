apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The base is never applied on its own. It has no Namespace of its own and
# its hostname and image tags are placeholders; a per-PR overlay adds the
# namespace, pins the images to a commit and rewrites the hostname. See
# ../README.md.
resources:
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - http-route.yaml
