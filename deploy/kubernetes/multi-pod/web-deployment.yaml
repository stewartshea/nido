apiVersion: apps/v1
kind: Deployment
metadata:
  name: nido-web
  namespace: nido
  labels:
    app: nido-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nido-web
  template:
    metadata:
      labels:
        app: nido-web
    spec:
      containers:
        - name: web
          # Replace with your registry image, e.g. ghcr.io/you/nido-web:latest
          image: nido/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            # Proxied to this target by src/hooks.server.ts for browser /api calls.
            - name: API_PROXY_TARGET
              value: "http://nido-api:3000"
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi