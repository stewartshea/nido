name: Preview environment

# A preview is a real deployment of a pull request, in the cluster, with its
# own database. It exists so a change can be exercised end to end — API and
# web, against real storage — before it merges.
#
# It is deployed on every push to the branch, and destroyed when the pull
# request is closed or merged. `pull_request: closed` covers both, because a
# merged pull request is a closed pull request.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    # Nightly, at 04:17 UTC. The teardown on `closed` is the normal path;
    # this catches the previews it missed. Early morning UTC is quiet for
    # the repository and off the hour, so it does not pile onto every other
    # scheduled job on the platform.
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy preview
    # A pull request from a fork gets a read-only GITHUB_TOKEN, so the
    # image is never pushed and there is nothing to deploy. Skipping it
    # here also keeps the cluster credential out of a fork's workflow run.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
    outputs:
      # The e2e job tests the deployment this job just made, so its URL has
      # to cross the job boundary.
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    concurrency:
      # One deployment per pull request, and a new push supersedes the
      # deployment in flight rather than queueing behind it.
      group: preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This workflow is independent of the build workflow, so it cannot
      # assume the image is already there. The tag is the same immutable
      # sha-<commit> tag the build workflow pushes — the first twelve
      # characters of the commit, the same shortening.
      - name: Wait for the image
        run: |
          set -euo pipefail
          IMAGE_TAG="sha-${HEAD_SHA:0:12}"
          for image in ghcr.io/stewartshea/nido/api ghcr.io/stewartshea/nido/web; do
            for attempt in $(seq 1 60); do
              if docker manifest inspect "$image:$IMAGE_TAG" >/dev/null 2>&1; then
                echo "$image:$IMAGE_TAG is in the registry"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::$image:$IMAGE_TAG never appeared in the registry. The build probably failed — check the build workflow."
                exit 1
              fi
              echo "waiting for $image:$IMAGE_TAG ($attempt/60)"
              sleep 10
            done
          done

      - name: Write the cluster kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$PREVIEW_KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy the preview
        id: deploy
        env:
          PREVIEW_KEY_SALT: ${{ secrets.PREVIEW_KEY_SALT }}
        run: |
          set -euo pipefail
          node scripts/preview.mjs deploy --pr "$PR_NUMBER" --sha "$HEAD_SHA" | tee /tmp/preview-deploy.log
          # The line is already in the `name=value` form the runner wants.
          grep '^PREVIEW_URL=' /tmp/preview-deploy.log >> "$GITHUB_OUTPUT"

      - name: Report the URL on the pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const marker = '<!-- nido-preview -->';
            const url = process.env.PREVIEW_URL;
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const body = [
              marker,
              '### Preview environment',
              '',
              `- **URL:** ${url}`,
              `- **Commit:** \`${sha}\``,
              '',
              'A real deployment of this pull request, in the cluster, with a',
              'database of its own. It is rebuilt on every push and deleted when',
              'the pull request is closed or merged.',
              '',
              '**Test account:** `test@example.com` / `TestPass123!` — seeded with',
              'sample data. Register with any email address instead if you want a',
              'clean family; the preview has no mail server, so there is no',
              'verification step. The data is disposable and goes away with the',
              'namespace.',
              '',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = data.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            if (process.env.DISCORD_WEBHOOK) {
              try {
                await fetch(process.env.DISCORD_WEBHOOK, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ content: `**Preview Ready** - PR #${issue_number}\nURL: ${url}\nCommit: ${sha}\n[View PR](https://github.com/${owner}/${repo}/pull/${issue_number})` })
                });
              } catch (e) {
                console.log('Discord notification failed:', e.message);
              }
            }

      - name: Add to the run summary
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          printf '### Preview environment\n\n%s\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Test the preview
    # The point of this job is that it tests the artifact users get: the
    # preview is a real deployment built from the same immutable images as
    # production, with its own database. Standing up a private copy of the
    # stack in CI would test a different tree than the one that ships —
    # exactly the failure mode this job exists to make impossible.
    needs: deploy
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      # Joins the deploy's group: a new push supersedes the whole run —
      # deployment and its tests — rather than queueing behind either.
      group: preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One root lockfile covers both workspaces; `npm ci` installs the
      # web workspace's devDependencies too, which is where Playwright lives.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The deploy job finishes when the namespace is applied, but the
      # ingress route and the app pod may need a few more seconds. Wait
      # for the preview to actually answer before spending test time on it.
      - name: Wait for the preview to answer
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PREVIEW_URL" || true)
            if [ "$code" != 000 ] && [ "$code" != 502 ] && [ "$code" != 503 ] && [ "$code" != 504 ]; then
              echo "preview answered with $code after $attempt attempt(s)"
              exit 0
            fi
            echo "waiting for $PREVIEW_URL ($attempt/60, last code $code)"
            sleep 10
          done
          echo "::error::$PREVIEW_URL never answered."
          exit 1

      # Every account the suite registers is a random @example.com user in
      # the preview's own database, which is deleted with the namespace.
      # The suite is serial and self-registering, so it needs no secrets.
      - name: Run the suite against the preview
        working-directory: web
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.preview_url }}
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: web/playwright-report/
          retention-days: 7

  sweep:
    name: Sweep orphaned previews
    # The backstop for a teardown that did not run.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write the cluster kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$PREVIEW_KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Delete previews whose pull request is gone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/preview.mjs sweep

  teardown:
    name: Tear down preview
    # `closed` covers merged and abandoned pull requests alike. Both leave a
    # namespace behind that nothing else will ever clean up.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write the cluster kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.PREVIEW_KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$PREVIEW_KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Delete the preview namespace
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/preview.mjs teardown --pr "$PR_NUMBER"

      - name: Say so on the pull request
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const marker = '<!-- nido-preview -->';
            const body = [
              marker,
              '### Preview environment',
              '',
              'Removed. The namespace for this pull request has been deleted.',
              '',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = data.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
            if (process.env.DISCORD_WEBHOOK) {
              try {
                await fetch(process.env.DISCORD_WEBHOOK, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ content: `**Preview Removed** - PR #${issue_number}\nNamespace deleted\n[View PR](https://github.com/${owner}/${repo}/pull/${issue_number})` })
                });
              } catch (e) {
                console.log('Discord notification failed:', e.message);
              }
            }
