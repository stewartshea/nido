services:
  api:
    build:
      context: ../../
      dockerfile: api/Dockerfile
    image: nido/api:latest
    ports:
      - "3000:3000"
    environment:
      # Required. Encrypts every per-family database via HKDF-SHA256; unset
      # would fall back to a hardcoded key that is public in this repo.
      # Generate with: openssl rand -hex 32
      - NIDO_MASTER_KEY=${NIDO_MASTER_KEY:?set NIDO_MASTER_KEY in .env (openssl rand -hex 32)}
      # Holds registry.db, db/<familyId>.db and photos/.
      - NIDO_DATA_DIR=${NIDO_DATA_DIR:-/data}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - SIGNUP_ENABLED=${SIGNUP_ENABLED:-}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3001}
      - PHOTO_DIR=${PHOTO_DIR:-/data/photos}
    volumes:
      - nido-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../../
      dockerfile: web/Dockerfile
    image: nido/web:latest
    ports:
      - "3001:3001"
    environment:
      # Forward the web Vite dev server's /api calls to the api service
      # (inside Compose the api service resolves to http://api:3000).
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://api:3000}
      # Leave empty so the client calls the API same-origin (/api/v1).
      # Set only when the API is served from a different origin than the web app.
      - PUBLIC_API_URL=${API_URL:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  nido-data: {}