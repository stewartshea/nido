apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nido
  namespace: nido
  annotations:
    # Adjust to your ingress controller.
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: nido.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nido-web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nido-api
                port:
                  number: 3000